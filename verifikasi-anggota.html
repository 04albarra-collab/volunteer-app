<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Anggota - Relawan Damkar</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icons">
          <img src="merahmerah.jpg" alt="Lambang Relawan" class="logo-small logo-merah">
          <img src="putih.jpg" alt="Lambang Putih" class="logo-small logo-putih">
        </div>
        <span>Relawan Damkar</span>
      </a>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Beranda</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="operator-login.html">Operator</a></li>
        <li><a href="login.html">Masuk</a></li>
        <li><a href="daftar.html">Daftar</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <h1>Halaman Verifikasi Anggota</h1>
    
    <div class="verifikasi-section">
      <h2>Daftar Menunggu Verifikasi</h2>
      <p>Total menunggu: <span id="total-pending">0</span></p>
      <div id="pending-list" class="pending-list">
        <!-- Daftar akan dimuat oleh JavaScript -->
      </div>
    </div>
    
    <div class="verifikasi-section" style="margin-top: 40px;">
      <h2>Setujui/Tolak Anggota</h2>
      <form id="verifikasi-form">
        <input type="hidden" id="verify-username" name="username">
        <button type="submit" class="btn-submit">Setujui Anggota</button>
        <button type="button" class="btn-cancel" style="background: #e74c3c; margin-left: 10px;">Tolak</button>
      </form>
    </div>

  <footer>
    <div class="container">
      <div class="footer-content">
        <div class="footer-logo">
          <img src="merahmerah.jpg" alt="Lambang Relawan" class="logo-small logo-merah">
          <span>Relawan Damkar</span>
        </div>
        <p>&copy; 2024 Relawan Damkar. Semua Hak Dilindungi.</p>
      </div>
    </div>
  </footer>

  <script>
    // Verifikasi data dari localStorage
    document.addEventListener('DOMContentLoaded', function() {
      // Ambil data verifikasi yang disimpan
      const daftarPending = [];
      for (let i = 0; i < localStorage.length; i++) {
        const kunci = localStorage.key(i);
        if (kunci && kunci.startsWith('verifikasi_')) {
          const data = JSON.parse(localStorage.getItem(kunci));
          if (data && data.status === 'menunggu') {
            daftarPending.push({
              username: data.username,
              email: data.email,
              waktu: data.waktu || 'Tidak diketahui'
            });
          }
        }
      }
      
      // Tampilkan daftar pending
      const pendingList = document.getElementById('pending-list');
      const totalPending = document.getElementById('total-pending');
      
      totalPending.textContent = daftarPending.length;
      
      if (daftarPending.length === 0) {
        pendingList.innerHTML = '<p>Tidak ada anggota menunggu verifikasi.</p>';
      } else {
        let html = '';
        daftarPending.forEach((item, index) => {
          html += `
            <div class="pending-item">
              <span>${item.username}</span>
              <span>${item.email}</span>
              <span>${item.waktu}</span>
              <div class="actions">
                <button class="btn-accept" data-username="${item.username}">Setujui</button>
                <button class="btn-reject" data-username="${item.username}">Tolak</button>
              </div>
            </div>
          `;
        });
        pendingList.innerHTML = html;
      }
      
      // Event listener untuk setujui
      document.querySelectorAll('.btn-accept').forEach(btn => {
        btn.addEventListener('click', function() {
          const username = this.getAttribute('data-username');
          verifikasiAnggota(username, 'terverifikasi');
        });
      });
      
      // Event listener untuk tolak
      document.querySelectorAll('.btn-reject').forEach(btn => {
        btn.addEventListener('click', function() {
          const username = this.getAttribute('data-username');
          verifikasiAnggota(username, 'ditolak');
        });
      });
      
      // Form submit
      const verifikasiForm = document.getElementById('verifikasi-form');
      verifikasiForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('verify-username').value;
        if (username) {
          verifikasiAnggota(username, 'terverifikasi');
        }
      });
    });
    
    function verifikasiAnggota(username, status) {
      // Update status verifikasi di localStorage
      const kunci = `verifikasi_${username}`;
      if (localStorage.getItem(kunci)) {
        const data = JSON.parse(localStorage.getItem(kunci));
        data.status = status;
        localStorage.setItem(kunci, JSON.stringify(data));
        
        alert(`Anggota ${username} telah ${status === 'terverifikasi' ? 'disetujui' : 'ditolak'}`);
        
        // Refresh page to update list
        setTimeout(() => {
          window.location.href = 'verifikasi-anggota.html';
        }, 100);
      }
    }
  </script>
</body>
</html>
