<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Relawan Damkar</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icons">
          <img src="damkar.jpg" alt="Lambang Damkar" class="logo-small">
          <img src="relawandamkar.jpg" alt="Lambang Relawan" class="logo-small">
        </div>
        <span>Relawan Damkar</span>
      </a>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Beranda</a></li>
        <li><a href="index.html#about">About Us</a></li>
        <li><a href="login.html" class="active">Masuk</a></li>
      </ul>
    </div>
  </nav>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="form-logo">
        <img src="damkar.jpg" alt="Lambang Damkar">
      </div>
      <h2>Selamat Datang</h2>
      <p class="form-subtitle">Masuk ke akun Relawan Damkar Anda</p>
      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="masukkan email Anda" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="masukkan password" required>
        </div>
        <button type="submit" class="btn-submit">Masuk</button>
      </form>
      <p class="form-link">Belum punya akun? <a href="daftar.html">Daftar di sini</a></p>
    </div>
  </div>

  <footer>
    <div class="container">
      <div class="footer-content">
        <div class="footer-logo">
          <img src="damkar.jpg" alt="Lambang Damkar" class="logo-small">
          <img src="relawandamkar.jpg" alt="Lambang Relawan" class="logo-small">
          <span>Relawan Damkar</span>
        </div>
        <p>&copy; 2024 Relawan Damkar. Semua Hak Dilindungi.</p>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
